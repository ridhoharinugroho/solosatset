name: One-shot auth hardening v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize existing auth migration
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('js/admin.js')
          t = p.read_text()
          t = re.sub(r"(?:async\s+)?function checkAuth\(\)\s*\{.*?\n\}\n\n(?:async\s+)?function handleLogin", """async function checkAuth() {
            const loginView = document.getElementById('admin-login-view');
            const dashboardView = document.getElementById('admin-dashboard-view');
            try {
              const response = await fetch('/api/admin-auth', { credentials: 'same-origin', cache: 'no-store' });
              const result = await response.json();
              if (result.authenticated) {
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                loadDashboard();
              } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
              }
            } catch {
              loginView.classList.remove('hidden');
              dashboardView.classList.add('hidden');
            }
            if (window.lucide) window.lucide.createIcons();
          }

          async function handleLogin""", t, count=1, flags=re.S)
          t = re.sub(r"(?:async\s+)?function handleLogin\(e\)\s*\{.*?\n\}\n\n(?:async\s+)?function handleLogout", """async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('admin-username').value.trim();
            const passwordInput = document.getElementById('admin-password').value;
            const errorAlert = document.getElementById('login-error-alert');
            const errorMsg = document.getElementById('login-error-msg');
            try {
              const response = await fetch('/api/admin-auth', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
              });
              const result = await response.json();
              if (!response.ok || !result.authenticated) throw new Error('invalid');
              errorAlert.classList.add('hidden');
              showToast('Login Admin Berhasil!', 'success');
              await checkAuth();
            } catch {
              errorAlert.classList.remove('hidden');
              errorMsg.textContent = 'Username atau Password salah! Periksa kembali kredensial Anda.';
              if (window.lucide) window.lucide.createIcons();
            }
          }

          async function handleLogout""", t, count=1, flags=re.S)
          t = re.sub(r"(?:async\s+)?function handleLogout\(\)\s*\{.*?\n\}\n\n// -------------------------------------------------------------\n// DASHBOARD INITIALIZATION", """async function handleLogout() {
            try {
              await fetch('/api/admin-auth', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'logout' })
              });
            } catch {}
            logout();
            showToast('Anda telah keluar dari Panel Admin.', 'info');
            await checkAuth();
            setTimeout(() => { window.location.href = 'admin.html'; }, 300);
          }

          // -------------------------------------------------------------
          // DASHBOARD INITIALIZATION""", t, count=1, flags=re.S)
          t = re.sub(r"postMessage\(([^,]+),\s*['\"]\*['\"]\)", r"postMessage(\1, window.location.origin)", t)
          p.write_text(t)
          for filename in ['js/services/auth.js', 'js/services/storage.js']:
            q = Path(filename)
            x = q.read_text()
            x = re.sub(r"(password\s*:\s*)['\"][^'\"]+['\"]", r"\1null", x)
            x = re.sub(r"(password\s*=\s*)['\"][^'\"]+['\"]", r"\1null", x)
            q.write_text(x)
      - name: Validate
        run: |
          node --check js/admin.js
          node --check js/services/auth.js
          node --check js/services/storage.js
          node --check api/admin-auth.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin.js js/services/auth.js js/services/storage.js
          git diff --cached --quiet || git commit -m 'security: finalize server-side admin authentication'
          git push
