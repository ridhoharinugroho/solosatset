name: Security Build Gate

on:
  push:
    branches:
      - security/otp-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'fix: route user profile mutations through authenticated server'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/otp-hardening
          fetch-depth: 0

      - name: Final auth compatibility repair
        run: |
          python - <<'PY'
          from pathlib import Path
          auth = Path('js/services/auth.js')
          s = auth.read_text()
          start = s.index('export async function saveUserAvatarDirectly(')
          end = s.index('export async function fetchFreshCurrentUserFromSupabase()', start)
          s = s[:start] + '''export async function saveUserAvatarDirectly(userOrId, avatarUrl) {
            const current = getCurrentUser();
            const targetId = typeof userOrId === 'string' ? userOrId : (userOrId?.id || current?.id);
            if (!targetId) throw new Error('Pengguna tidak ditemukan.');
            const cleanAvatar = typeof avatarUrl === 'string' && avatarUrl.trim() ? avatarUrl.trim() : null;
            const response = await postJson('/api/user-profile', { avatar: cleanAvatar });
            const user = stripCredentialFields(response.user);
            setCurrentUser({ ...current, ...user });
            return { success: true, avatar: cleanAvatar };
          }

          ''' + s[end:]
          start = s.index('export async function updateProfile(')
          end = s.index('export async function removeUserAvatar(', start)
          s = s[:start] + '''export async function updateProfile({ name, storeName, email, phone, region, district, bio, avatar }) {
            const currentUser = getCurrentUser();
            if (!currentUser) throw new Error('Pengguna belum login.');
            let finalAvatar = avatar !== undefined ? avatar : currentUser.avatar;
            if (typeof finalAvatar === 'string' && finalAvatar.startsWith('data:')) finalAvatar = await sbUploadAvatar(finalAvatar);
            const response = await postJson('/api/user-profile', { name, storeName, email, phone, region, district, bio, avatar: finalAvatar });
            const user = stripCredentialFields(response.user);
            setCurrentUser({ ...currentUser, ...user, isProfileConfigured: true, updatedAt: new Date().toISOString() });
            const index = inMemoryRegisteredUsers.findIndex((item) => item.id === currentUser.id);
            if (index >= 0) inMemoryRegisteredUsers[index] = stripCredentialFields({ ...inMemoryRegisteredUsers[index], ...user });
            window.dispatchEvent(new CustomEvent('registeredUsersChanged', { detail: inMemoryRegisteredUsers }));
            return getCurrentUser();
          }

          ''' + s[end:]
          start = s.index('export async function removeUserAvatar(')
          end = s.index('export async function logout()', start)
          s = s[:start] + '''export async function removeUserAvatar(userId) {
            const current = getCurrentUser();
            const targetId = String(userId || current?.id || '').trim();
            if (!targetId || !current || targetId !== String(current.id)) throw new Error('Pengguna tidak ditemukan.');
            const filePath = extractAvatarFilePath(current.avatar);
            if (filePath) await sbDeleteAvatar(filePath);
            const response = await postJson('/api/user-profile', { avatar: null });
            const user = stripCredentialFields(response.user);
            setCurrentUser({ ...current, ...user });
            return { success: true, message: 'Foto profil / avatar berhasil dihapus.' };
          }

          ''' + s[end:]
          s = s.replace("if (cleanPassword.length < 5) throw new Error('Password baru minimal 5 karakter.');", "if (cleanPassword.length < 8) throw new Error('Password baru minimal 8 karakter.');")
          auth.write_text(s)
          admin = Path('js/admin.js')
          a = admin.read_text().replace("desktopFrame.contentWindow.postMessage(e.data, '*');", "desktopFrame.contentWindow.postMessage(e.data, window.location.origin);")
          admin.write_text(a)
          PY

      - name: Commit repaired sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/services/auth.js js/admin.js
          git diff --cached --quiet || git commit -m 'fix: route user profile mutations through authenticated server'
          git push origin security/otp-hardening

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security build gate
        run: npm run build
