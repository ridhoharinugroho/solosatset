name: one-shot-monolith-refactor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild from baseline and compact monoliths
        run: |
          set -euo pipefail
          cp scripts/refactor-monoliths.mjs /tmp/refactor-monoliths.mjs
          git fetch origin 478ba8574350eb89b78e08a5bef3f7e064a669e3
          git checkout 478ba8574350eb89b78e08a5bef3f7e064a669e3 -- js/app.js js/toko-saya.js
          node /tmp/refactor-monoliths.mjs
          rm -f scripts/refactor-monoliths.mjs .github/workflows/_refactor_once.yml
          node --check js/app.js
          node --check js/toko-saya.js
          node --check js/utils/toast.js
          node --check js/utils/modalController.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft 478ba8574350eb89b78e08a5bef3f7e064a669e3
          git add -A
          git commit -m 'refactor: materially reduce monolithic app and store controllers'
          git push --force origin HEAD:main
