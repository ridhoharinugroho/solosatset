name: One-shot Architecture Dedupe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dedupe:
    if: github.event.head_commit.message != 'REFACTOR: Centralize runtime helpers, formatters and SW version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic refactor
        run: node scripts/refactor-dedupe.mjs

      - name: Syntax gate
        run: node scripts/test-syntax.js

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/toko-saya.js js/services/auth.js js/services/storage.js js/utils/runtime.js
          if git diff --cached --quiet; then
            echo 'No refactor changes.'
            exit 0
          fi
          git commit -m 'REFACTOR: Centralize runtime helpers, formatters and SW version'
          git push origin main
