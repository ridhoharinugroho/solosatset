name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare utility directory
        run: mkdir -p js/utils
      - name: Show SW version assignments
        run: grep -RniE "CURRENT_SW_VERSION[[:space:]]*=" js --include='*.js' || true
      - name: Run deterministic architecture refactor
        run: node scripts/refactor-dedupe.mjs
      - name: Syntax gate
        run: node scripts/test-syntax.js
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/toko-saya.js js/services/auth.js js/services/storage.js js/utils/runtime.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'REFACTOR: Centralize runtime helpers, formatters and SW version'
          git push origin main
