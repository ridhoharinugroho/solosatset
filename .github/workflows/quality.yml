name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run project test suite
        run: npm test

      - name: Run combined audit
        continue-on-error: true
        run: npm run audit:all

      - name: Run security pattern audit
        continue-on-error: true
        run: npm run audit:security
