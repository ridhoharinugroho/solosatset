name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare utility directory
        run: mkdir -p js/utils
      - name: Centralize admin SW version source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/admin.js')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          text = text.replace("const CURRENT_SW_VERSION = '20260902_v214';\n", '', 1)
          if "from './utils/runtime.js'" not in text:
              marker = "import { logout } from './services/auth.js';\n"
              if marker not in text:
                  raise SystemExit('admin.js import marker not found')
              text = text.replace(marker, marker + "import { CURRENT_SW_VERSION } from './utils/runtime.js';\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run deterministic architecture refactor
        run: node scripts/refactor-dedupe.mjs
      - name: Preserve formatter semantics
        run: |
          sed -i "s/if (!rawRegion) return 'Solo';/if (!rawRegion) return 'Solo Raya';/" js/utils/runtime.js
      - name: Syntax and targeted architecture gate
        run: node scripts/test-syntax.js
      - name: Final targeted duplication gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('js')
          files = list(root.rglob('*.js'))
          text = '\n'.join(p.read_text(encoding='utf-8') for p in files)
          checks = {
              'refreshIcons definitions': len(re.findall(r'function\s+refreshIcons\s*\(', text)),
              'deferTask definitions': len(re.findall(r'function\s+deferTask\s*\(', text)),
              'CURRENT_SW_VERSION assignments': len(re.findall(r'CURRENT_SW_VERSION\s*=\s*[\'\"]', text)),
              'formatRegionTitle definitions': len(re.findall(r'(?:export\s+)?function\s+formatRegionTitle\s*\(', text)),
              'formatDistrictTitle definitions': len(re.findall(r'(?:export\s+)?function\s+formatDistrictTitle\s*\(', text)),
          }
          for key, value in checks.items():
              print(f'{key}: {value}')
              if value != 1:
                  sys.exit(f'{key} expected 1, got {value}')
          assert Path('js/utils/runtime.js').is_file()
          assert "./utils/runtime.js" in (Path('js/app.js').read_text(encoding='utf-8'))
          assert "./utils/runtime.js" in (Path('js/toko-saya.js').read_text(encoding='utf-8'))
          assert "./utils/runtime.js" in (Path('js/admin.js').read_text(encoding='utf-8'))
          assert "../utils/runtime.js" in (Path('js/services/auth.js').read_text(encoding='utf-8'))
          assert "../utils/runtime.js" in (Path('js/services/storage.js').read_text(encoding='utf-8'))
          assert '20260901_v151' not in Path('js/toko-saya.js').read_text(encoding='utf-8')
          assert "20260902_v214" in Path('js/utils/runtime.js').read_text(encoding='utf-8')
          print('TARGETED_DEDUPE_VERIFICATION=PASS')
          PY
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/toko-saya.js js/admin.js js/services/auth.js js/services/storage.js js/utils/runtime.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'REFACTOR: Centralize runtime helpers, formatters and SW version'
          git push origin main
