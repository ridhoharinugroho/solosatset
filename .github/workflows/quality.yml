name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare utility directory
        run: mkdir -p js/utils
      - name: Show SW version assignments
        run: grep -RniE "CURRENT_SW_VERSION[[:space:]]*=" js --include='*.js' || true
      - name: Run deterministic architecture refactor
        run: node scripts/refactor-dedupe.mjs
      - name: Centralize admin SW version consumer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/admin.js')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          text = text.replace("const CURRENT_SW_VERSION = '20260902_v214';\n", '', 1)
          if "from './utils/runtime.js'" not in text:
              marker = "import { logout } from './services/auth.js';\n"
              if marker not in text:
                  raise SystemExit('admin.js import marker not found')
              text = text.replace(marker, marker + "import { CURRENT_SW_VERSION } from './utils/runtime.js';\n", 1)
          path.write_text(text, encoding='utf-8')

          runtime = Path('js/utils/runtime.js')
          runtime_text = runtime.read_text(encoding='utf-8')
          runtime_text = runtime_text.replace("if (!rawRegion) return 'Solo';", "if (!rawRegion) return 'Solo Raya';", 1)
          runtime.write_text(runtime_text, encoding='utf-8')
          PY
      - name: Syntax and targeted architecture gate
        run: |
          node scripts/test-syntax.js
          node scripts/refactor-dedupe.mjs
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/toko-saya.js js/admin.js js/services/auth.js js/services/storage.js js/utils/runtime.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'REFACTOR: Centralize runtime helpers, formatters and SW version'
          git push origin main
