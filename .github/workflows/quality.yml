name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  javascript-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-shot production source refactor
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: enable one-shot source refactor'
        run: |
          set -euo pipefail
          BASE_SHA=478ba8574350eb89b78e08a5bef3f7e064a669e3
          cp scripts/refactor-monoliths.mjs /tmp/refactor-monoliths.mjs
          git reset --hard "$BASE_SHA"
          node /tmp/refactor-monoliths.mjs
          node --check js/app.js
          node --check js/toko-saya.js
          node --check js/utils/toast.js
          node --check js/utils/modalController.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: materially reduce monolithic app and store controllers'
          git push --force origin HEAD:main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project test suite
        run: npm test

      - name: Run production build gate
        run: npm run build

      - name: Run duplication audit
        run: npm run audit:duplication
