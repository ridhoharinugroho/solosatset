name: Refactor Dedupe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor == 'ridhoharinugroho'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted deduplication
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          runtime = root / 'js/utils/runtime.js'
          runtime.parent.mkdir(parents=True, exist_ok=True)
          runtime.write_text('''/**\n * Shared runtime helpers and application-wide constants.\n */\n\nexport const CURRENT_SW_VERSION = '20260902_v214';\n\nconst iconRefreshQueue = new Set();\nlet iconRefreshScheduled = false;\n\nexport function refreshIcons(root = null) {\n  if (typeof window === 'undefined' || !window.lucide || typeof window.lucide.createIcons !== 'function') return;\n\n  if (root && root instanceof HTMLElement) {\n    iconRefreshQueue.add(root);\n  } else {\n    iconRefreshQueue.add(document.body || document.documentElement);\n  }\n\n  if (iconRefreshScheduled) return;\n  iconRefreshScheduled = true;\n\n  const run = () => {\n    iconRefreshScheduled = false;\n    const roots = Array.from(iconRefreshQueue);\n    iconRefreshQueue.clear();\n\n    const hasGlobal = roots.some((item) => item === document.body || item === document.documentElement);\n    if (hasGlobal) {\n      try { window.lucide.createIcons(); } catch (e) {}\n    } else {\n      roots.forEach((item) => {\n        try { window.lucide.createIcons({ root: item }); } catch (e) {}\n      });\n    }\n  };\n\n  if ('requestIdleCallback' in window) {\n    window.requestIdleCallback(run, { timeout: 60 });\n  } else {\n    setTimeout(run, 1);\n  }\n}\n\nexport function deferTask(fn, timeout = 50) {\n  if (typeof fn !== 'function') return;\n  if ('requestIdleCallback' in window) {\n    window.requestIdleCallback(() => fn(), { timeout });\n  } else {\n    setTimeout(() => fn(), 0);\n  }\n}\n\nif (typeof window !== 'undefined') {\n  window.refreshIcons = refreshIcons;\n  window.deferTask = deferTask;\n}\n\nexport function formatRegionTitle(rawRegion) {\n  if (!rawRegion) return 'Solo';\n  const reg = rawRegion.toString().trim().toLowerCase();\n  const map = {\n    solo: 'Solo',\n    surakarta: 'Solo',\n    karanganyar: 'Karanganyar',\n    sukoharjo: 'Sukoharjo',\n    wonogiri: 'Wonogiri',\n    sragen: 'Sragen',\n    boyolali: 'Boyolali',\n    klaten: 'Klaten',\n    soloraya: 'Solo Raya',\n    'solo raya': 'Solo Raya'\n  };\n  if (map[reg]) return map[reg];\n  return reg.charAt(0).toUpperCase() + reg.slice(1);\n}\n\nexport function formatDistrictTitle(rawDistrict) {\n  if (!rawDistrict) return '';\n  const clean = rawDistrict.toString().trim().replace(/^Kec\\.?\\s*/i, '').replace(/\\.+$/, '');\n  return clean.split(' ').map((word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');\n}\n''', encoding='utf-8')

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          shared_block = re.compile(
              r"// ========================================================\n"
              r"// HIGH-PERFORMANCE NON-BLOCKING INP OPTIMIZATIONS\n"
              r"// ========================================================\n"
              r"const iconRefreshQueue = new Set\(\);.*?window\.deferTask = deferTask;\n",
              re.S,
          )

          for rel in ['js/app.js', 'js/toko-saya.js']:
              path = root / rel
              text = read(path)
              new_text, removed = shared_block.subn('', text, count=1)
              if removed != 1:
                  raise SystemExit(f'Expected shared runtime block in {rel}, removed={removed}')

              new_text = re.sub(r"^const CURRENT_SW_VERSION = ['\"][^'\"]+['\"];\n?", '', new_text, count=1, flags=re.M)
              new_text = re.sub(
                  r"\bformatRegionTitle, formatDistrictTitle\s*\n",
                  '',
                  new_text,
                  count=1,
              )
              new_text = re.sub(
                  r"\bformatRegionTitle, formatDistrictTitle\r?\n",
                  '',
                  new_text,
                  count=1,
              )

              import_line = "import { refreshIcons, deferTask, CURRENT_SW_VERSION, formatRegionTitle, formatDistrictTitle } from './utils/runtime.js';\n"
              if import_line not in new_text:
                  marker = "\n/**\n * Pusat Jual Beli Solo Raya - Main Application Controller"
                  if rel == 'js/toko-saya.js':
                      marker = "\n/**\n * Toko Saya Standalone Page Controller"
                  if marker not in new_text:
                      raise SystemExit(f'Could not find insertion marker in {rel}')
                  new_text = new_text.replace(marker, f"\n{import_line}{marker}", 1)
              write(path, new_text)

          storage = root / 'js/services/storage.js'
          text = read(storage)
          formatter_block = re.compile(
              r"export function formatRegionTitle\(rawRegion\) \{.*?\n\}\n\nexport function formatDistrictTitle\(rawDistrict\) \{.*?\n\}\n",
              re.S,
          )
          text, removed = formatter_block.subn('', text, count=1)
          if removed != 1:
              raise SystemExit('Expected formatter block in storage.js')
          runtime_import = "import { formatRegionTitle, formatDistrictTitle } from '../utils/runtime.js';\n"
          if runtime_import not in text:
              text = text.replace("import { supabase } from '../lib/supabase.js';\n", "import { supabase } from '../lib/supabase.js';\n" + runtime_import, 1)
          if 'export { formatRegionTitle, formatDistrictTitle };' not in text:
              insert_after = runtime_import
              text = text.replace(insert_after, insert_after + 'export { formatRegionTitle, formatDistrictTitle };\n', 1)
          write(storage, text)

          auth = root / 'js/services/auth.js'
          text = read(auth)
          auth_formatter_block = re.compile(
              r"/\*\*\n \* Helper Format Nama Wilayah Kabupaten / Kota\n \*/\n"
              r"export function formatRegionTitle\(rawRegion\) \{.*?\n\}\n"
              r"window\.formatRegionTitle = formatRegionTitle;\n\n"
              r"/\*\*\n \* Helper Format Nama Wilayah Kecamatan\n \*/\n"
              r"export function formatDistrictTitle\(rawDistrict\) \{.*?\n\}\n"
              r"window\.formatDistrictTitle = formatDistrictTitle;\n\n",
              re.S,
          )
          text, removed = auth_formatter_block.subn('', text, count=1)
          if removed != 1:
              raise SystemExit('Expected formatter block in auth.js')
          runtime_import = "import { formatRegionTitle, formatDistrictTitle } from '../utils/runtime.js';\n"
          if runtime_import not in text:
              text = text.replace("import { supabase } from '../lib/supabase.js';\n", "import { supabase } from '../lib/supabase.js';\n" + runtime_import, 1)
          if 'export { formatRegionTitle, formatDistrictTitle };' not in text:
              anchor = runtime_import
              text = text.replace(anchor, anchor + 'export { formatRegionTitle, formatDistrictTitle };\n', 1)
          write(auth, text)

          print('Targeted refactor applied.')
EOF

      - name: Verify syntax and targeted deduplication
        shell: bash
        run: |
          node scripts/test-syntax.js
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          files = [p for p in root.joinpath('js').rglob('*.js')]
          text = '\n'.join(p.read_text(encoding='utf-8') for p in files)

          checks = {
              'refreshIcons definitions': len(re.findall(r'function\s+refreshIcons\s*\(', text)),
              'deferTask definitions': len(re.findall(r'function\s+deferTask\s*\(', text)),
              'CURRENT_SW_VERSION assignments': len(re.findall(r'CURRENT_SW_VERSION\s*=\s*[\'\"]', text)),
              'formatRegionTitle definitions': len(re.findall(r'(?:export\s+)?function\s+formatRegionTitle\s*\(', text)),
              'formatDistrictTitle definitions': len(re.findall(r'(?:export\s+)?function\s+formatDistrictTitle\s*\(', text)),
          }
          expected = {
              'refreshIcons definitions': 1,
              'deferTask definitions': 1,
              'CURRENT_SW_VERSION assignments': 1,
              'formatRegionTitle definitions': 1,
              'formatDistrictTitle definitions': 1,
          }
          for key, value in checks.items():
              print(f'{key}: {value}')
              if value != expected[key]:
                  print(f'FAIL: {key} expected {expected[key]} got {value}', file=sys.stderr)
                  sys.exit(1)

          runtime = root / 'js/utils/runtime.js'
          app = root / 'js/app.js'
          toko = root / 'js/toko-saya.js'
          storage = root / 'js/services/storage.js'
          auth = root / 'js/services/auth.js'
          assert 'refreshIcons' in runtime.read_text(encoding='utf-8')
          assert "./utils/runtime.js" in app.read_text(encoding='utf-8')
          assert "./utils/runtime.js" in toko.read_text(encoding='utf-8')
          assert "../utils/runtime.js" in storage.read_text(encoding='utf-8')
          assert "../utils/runtime.js" in auth.read_text(encoding='utf-8')
          assert '20260901_v151' not in toko.read_text(encoding='utf-8')
          assert 'window.refreshIcons = refreshIcons;' not in app.read_text(encoding='utf-8')
          assert 'window.refreshIcons = refreshIcons;' not in toko.read_text(encoding='utf-8')
          print('Targeted deduplication verification: PASS')
          PY

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/toko-saya.js js/services/auth.js js/services/storage.js js/utils/runtime.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'REFACTOR: Centralize shared runtime helpers and SW version'
          git push origin main
