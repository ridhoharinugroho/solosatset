  <!-- 4.5 USER PROFILE SETTINGS MODAL (TAB PROFIL AKUN) -->
  <div id="modal-user-profile" class="fixed inset-0 z-[10000] hidden flex items-center justify-center p-3 sm:p-4 md:p-6">
    <div class="modal-backdrop fixed inset-0 bg-slate-950/75 backdrop-blur-sm" data-close-modal="modal-user-profile">
    </div>

    <div
      class="modal-content relative z-10 w-full max-w-2xl h-[92vh] max-h-[92vh] bg-white rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col text-slate-800 animate-in fade-in zoom-in-95 duration-150">

      <!-- Modal Header -->
      <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-200 bg-gradient-to-r from-rose-950 via-rose-900 to-amber-950 text-white flex-shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-amber-400 text-rose-950 flex items-center justify-center font-black shadow-md flex-shrink-0">
            <i data-lucide="user-cog" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-black text-white text-base sm:text-lg leading-tight">Pengaturan Profil & Akun</h3>
            <p class="text-[11px] sm:text-xs text-rose-200 font-medium">Identitas penjual, WhatsApp, email, dan password</p>
          </div>
        </div>
        <button type="button" class="p-2 text-rose-200 hover:text-white rounded-xl hover:bg-rose-900 transition-colors cursor-pointer"
          data-close-modal="modal-user-profile">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Body (Standard Form) -->
      <form id="form-user-profile-settings" onsubmit="handleSaveProfileSettings(event)"
        class="p-3 flex-1 text-slate-800 overflow-y-auto bg-slate-50/50 flex flex-col">

        <div class="m-auto max-w-lg w-full space-y-3 pb-1">

          <!-- Profile Header Avatar & Summary Section -->
          <div class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-2xl shadow-sm">
            <img id="profile-edit-avatar-preview" src="" alt="Avatar"
              class="w-14 h-14 rounded-xl object-cover border-2 border-rose-900 flex-shrink-0 shadow-sm">
            <div class="flex-1 min-w-0">
              <h4 id="profile-edit-name-preview" class="font-black text-[13px] sm:text-sm text-slate-900 truncate leading-tight">Nama Akun</h4>
              <p id="profile-edit-joined-preview" class="text-[11px] text-slate-500 truncate leading-tight mt-0.5">Bergabung: -</p>
              <div class="pt-1.5 flex items-center gap-2 flex-wrap">
                <label id="profile-avatar-upload-wrapper"
                  class="hidden inline-flex items-center gap-1 text-[11px] font-bold bg-white text-rose-900 border border-rose-300 hover:bg-rose-50 px-2.5 py-1 rounded-lg cursor-pointer transition-colors shadow-sm">
                  <i data-lucide="camera" class="w-3 h-3"></i>
                  <span id="label-avatar-upload-text">Ganti Avatar</span>
                  <input type="file" id="profile-edit-avatar-file" accept="image/*" class="hidden">
                </label>
                <button type="button" id="btn-profile-delete-avatar" onclick="handleDeleteProfileAvatar(event)"
                  class="hidden inline-flex items-center gap-1 text-[11px] font-bold bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 px-2.5 py-1 rounded-lg cursor-pointer transition-colors shadow-sm"
                  title="Hapus Foto Profil / Avatar">
                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                  <span>Hapus Foto</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Section 1: Data Identitas & Kontak -->
          <div class="space-y-2 bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
            <!-- 1. Nama Lengkap -->
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Nama Lengkap</label>
              <input type="text" id="profile-input-name" name="name" required disabled placeholder="Nama lengkap"
                class="w-full px-2.5 py-1.5 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none transition-all disabled:opacity-85 disabled:cursor-not-allowed">
            </div>

            <!-- 2. Nama Toko Publik -->
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Nama Toko Publik</label>
              <input type="text" id="profile-input-store-name" name="storeName" required disabled placeholder="Nama toko"
                class="w-full px-2.5 py-1.5 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none transition-all disabled:opacity-85 disabled:cursor-not-allowed">
            </div>

            <!-- 3. WhatsApp -->
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">WhatsApp</label>
              <div class="relative">
                <input type="tel" id="profile-input-phone" name="phone" required disabled placeholder="08xxxxxxxxxx"
                  class="w-full pl-8 pr-2.5 py-1.5 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none transition-all disabled:opacity-85 disabled:cursor-not-allowed">
                <i data-lucide="phone" class="w-3.5 h-3.5 text-emerald-600 absolute left-2.5 top-2"></i>
              </div>
            </div>

            <!-- 4. Email -->
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Email</label>
              <div class="relative">
                <input type="email" id="profile-input-email" name="email" autocomplete="username" required disabled placeholder="email@contoh.com"
                  class="w-full pl-8 pr-2.5 py-1.5 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none transition-all disabled:opacity-85 disabled:cursor-not-allowed">
                <i data-lucide="mail" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2"></i>
              </div>
            </div>

            <!-- 5. Kabupaten / Kota -->
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Kabupaten / Kota</label>
              <input type="hidden" name="region" id="profile-input-region" value="solo">
              <button type="button" id="btn-open-profile-region-picker" disabled
                class="w-full px-2.5 py-1.5 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none transition-all disabled:opacity-85 disabled:cursor-not-allowed flex items-center justify-between text-left h-8">
                <div class="flex items-center gap-1.5 min-w-0 truncate">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-800 flex-shrink-0"></i>
                  <span id="profile-region-trigger-text" class="truncate font-semibold">Kota Solo (Surakarta)</span>
                </div>
                <i data-lucide="chevron-down" id="profile-region-trigger-chevron"
                  class="w-3.5 h-3.5 text-slate-400 flex-shrink-0 hidden"></i>
              </button>
            </div>

            <!-- 6. Kecamatan -->
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Kecamatan</label>
              <input type="hidden" name="district" id="profile-input-district" value="Banjarsari">
              <button type="button" id="btn-open-profile-district-picker" disabled
                class="w-full px-2.5 py-1.5 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none transition-all disabled:opacity-85 disabled:cursor-not-allowed flex items-center justify-between text-left h-8">
                <div class="flex items-center gap-1.5 min-w-0 truncate">
                  <i data-lucide="navigation" class="w-3.5 h-3.5 text-rose-800 flex-shrink-0"></i>
                  <span id="profile-district-trigger-text" class="truncate font-semibold">Kec. Banjarsari</span>
                </div>
                <i data-lucide="chevron-down" id="profile-district-trigger-chevron"
                  class="w-3.5 h-3.5 text-slate-400 flex-shrink-0 hidden"></i>
              </button>
            </div>

            <!-- 7. Bio / Deskripsi Toko -->
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Bio / Deskripsi Toko</label>
              <textarea id="profile-input-bio" name="bio" rows="1" disabled placeholder="Deskripsi singkat toko Anda..."
                class="w-full px-2.5 py-1 bg-slate-100 border border-slate-300 rounded-lg text-xs font-medium text-slate-700 focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none transition-all disabled:opacity-85 disabled:cursor-not-allowed h-7 max-h-12 min-h-[28px]"></textarea>
            </div>
          </div>

          <!-- Section 2: Keamanan & Ganti Password -->
          <div id="profile-password-section" class="hidden bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Password Baru (Opsional)</label>
              <input type="password" id="profile-input-new-password" autocomplete="new-password" disabled placeholder="Kosongkan jika tetap"
                class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none">
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-0.5">Ulangi Password</label>
              <input type="password" id="profile-input-confirm-password" autocomplete="new-password" disabled placeholder="Konfirmasi password"
                class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-rose-900 focus:bg-white focus:outline-none">
            </div>
          </div>
        </div>
      </form>

      <!-- Action Buttons Footer -->
      <div class="p-3 sm:p-4 border-t border-slate-200 flex items-center justify-between gap-3 bg-white">
        <!-- Left: Logout Button -->
        <button type="button" id="btn-profile-logout" onclick="handleProfileLogout(event)"
          class="px-3 py-1.5 text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl border border-rose-200 flex items-center justify-center gap-1.5 transition-colors cursor-pointer">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Log Out</span>
        </button>

        <!-- Right: Mode Controls -->
        <div class="flex items-center gap-2 justify-end">
          <!-- Tombol Edit Profil -->
          <button type="button" id="btn-profile-enable-edit" onclick="enableProfileEditMode(event)"
            class="px-4 py-1.5 text-xs font-black text-white bg-slate-900 hover:bg-slate-800 rounded-xl shadow-md flex items-center justify-center gap-1.5 transition-all cursor-pointer">
            <i data-lucide="edit-3" class="w-3.5 h-3.5 text-amber-300"></i>
            <span>Edit Profil</span>
          </button>

          <!-- Tombol Batalkan Perubahan -->
          <button type="button" id="btn-profile-cancel-edit" onclick="cancelProfileEditMode(event)"
            class="hidden px-3.5 py-1.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl border border-slate-300 transition-colors cursor-pointer">
            Batalkan
          </button>

          <!-- Tombol Simpan Perubahan -->
          <button type="submit" form="form-user-profile-settings" id="btn-profile-save"
            class="hidden px-4 py-1.5 text-xs font-black text-white bg-rose-900 hover:bg-rose-800 rounded-xl shadow-md flex items-center justify-center gap-1.5 transition-all cursor-pointer">
            <i data-lucide="save" class="w-3.5 h-3.5 text-amber-300"></i>
            <span>Simpan</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL POPUP: PILIH KABUPATEN / KOTA PROFIL -->
  <div id="modal-profile-region-picker" class="fixed inset-0 z-[10050] hidden flex items-center justify-center p-4">
    <div class="modal-backdrop fixed inset-0 bg-slate-950/75 backdrop-blur-xs"
      data-close-modal="modal-profile-region-picker"></div>
    <div
      class="modal-content relative w-full max-w-sm sm:max-w-md bg-white rounded-3xl shadow-2xl z-10 flex flex-col max-h-[82vh] overflow-hidden animate-in fade-in zoom-in-95 duration-150 border border-slate-100">

      <!-- Modal Header -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 bg-slate-50 flex-shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-xl bg-rose-100 text-rose-900 flex items-center justify-center flex-shrink-0">
            <i data-lucide="map-pin" class="w-4 h-4 text-rose-900"></i>
          </div>
          <div>
            <h4 class="font-black text-xs text-slate-900 leading-tight">Pilih Kabupaten / Kota</h4>
            <p class="text-[9.5px] text-slate-500">Pilih wilayah domisili / toko Anda di Solo Raya</p>
          </div>
        </div>
        <button type="button" data-close-modal="modal-profile-region-picker"
          class="p-1 text-slate-400 hover:text-slate-700 rounded-lg hover:bg-slate-200/50 cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- List of Profile Regions -->
      <div class="p-3 sm:p-3.5 overflow-y-auto space-y-1.5 flex-1" id="picker-profile-region-list">
      </div>
    </div>
  </div>

  <!-- MODAL POPUP: PILIH KECAMATAN PROFIL -->
  <div id="modal-profile-district-picker" class="fixed inset-0 z-[10050] hidden flex items-center justify-center p-4">
    <div class="modal-backdrop fixed inset-0 bg-slate-950/75 backdrop-blur-xs"
      data-close-modal="modal-profile-district-picker"></div>
    <div
      class="modal-content relative w-full max-w-sm sm:max-w-md bg-white rounded-3xl shadow-2xl z-10 flex flex-col max-h-[82vh] overflow-hidden animate-in fade-in zoom-in-95 duration-150 border border-slate-100">

      <!-- Modal Header -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 bg-slate-50 flex-shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-xl bg-rose-100 text-rose-900 flex items-center justify-center flex-shrink-0">
            <i data-lucide="navigation" class="w-4 h-4 text-rose-900"></i>
          </div>
          <div>
            <h4 class="font-black text-xs text-slate-900 leading-tight" id="profile-district-modal-title">Pilih
              Kecamatan</h4>
            <p class="text-[9.5px] text-slate-500" id="profile-district-modal-subtitle">Daftar kecamatan di wilayah
              terpilih</p>
          </div>
        </div>
        <button type="button" data-close-modal="modal-profile-district-picker"
          class="p-1 text-slate-400 hover:text-slate-700 rounded-lg hover:bg-slate-200/50 cursor-pointer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- List of Profile Districts -->
      <div class="p-3 sm:p-3.5 overflow-y-auto space-y-1.5 flex-1" id="picker-profile-district-list">
      </div>
    </div>
  </div>
